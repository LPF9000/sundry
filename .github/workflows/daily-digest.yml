name: Daily Semiconductor & DV Digest

on:
  schedule:
    # 12:00 UTC daily ≈ 8am ET / 5am PT. Adjust to taste — GitHub cron is
    # always UTC, and Actions schedules can lag a few minutes at busy times.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python-env

      - name: Build digest
        run: python -m semiconductor_digest

      - name: Commit archive & dedupe cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests state/seen.json
          git diff --cached --quiet || git commit -m "Daily digest $(date -u +%Y-%m-%d)"
          git push

      - name: Send email
        if: env.DIGEST_HAS_CONTENT == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ env.DIGEST_SUBJECT }}
          to: bestasitis@gmail.com
          from: "Semiconductor News Bot <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://digest_output/latest.html
