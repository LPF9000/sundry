name: Feature request
description: Propose a new source, category, or capability for the digest pipeline
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Want a digest for your own topic? You don't need an issue for
        that, and you don't need to fork either — run `sundry
        init` in your own repo, or see the README's "Using this for your
        own topic" section. This form is for changes to the tool itself.

  - type: textarea
    id: what
    attributes:
      label: What are you proposing
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What's missing today, or what problem this solves.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this
      options:
        - New fetcher type (a source that isn't RSS/arXiv/HN)
        - Change to classification/dedupe/rendering logic
        - Change to `sundry init` scaffolding
        - Something else
    validations:
      required: true
