name: Feature request
description: Propose a new source, category, or capability for the digest pipeline
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Want a new *topic* covered for your own use (not this repo's
        default semiconductor/DV topic)? You don't need an issue for
        that, and you don't need to fork either — see the README's
        "Using this for your own topic" section. This form is for
        changes to the tool itself.

  - type: textarea
    id: what
    attributes:
      label: What are you proposing
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What's missing today, or what problem this solves.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this
      options:
        - New RSS/Atom source
        - New arXiv or Hacker News search
        - New or reweighted category in config/feeds.toml
        - New fetcher type (a source that isn't RSS/arXiv/HN)
        - Change to classification/dedupe/rendering logic
        - Something else
    validations:
      required: true
