name: "Set up semiconductor-digest"
description: >
  Installs uv and syncs the semiconductor_digest package from the
  committed lockfile, so every workflow in this repo sets up its
  environment the same reproducible way instead of repeating steps.
inputs:
  extras:
    description: "Optional extras group to sync, e.g. 'dev'. Leave empty for a plain runtime install."
    required: false
    default: ""
  python-version:
    description: "Python version to set up."
    required: false
    default: "3.12"
runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: Sync dependencies (uv.lock)
      shell: bash
      run: |
        if [ -n "${{ inputs.extras }}" ]; then
          uv sync --locked --extra "${{ inputs.extras }}"
        else
          uv sync --locked
        fi
